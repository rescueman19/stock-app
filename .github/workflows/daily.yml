name: 매일 급락주 찾기

on:
  schedule:
    - cron: '10 7 * * 1-5'
    - cron: '10 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stock_screener/requirements.txt

      - name: 필요한 프로그램 설치
        run: pip install -r stock_screener/requirements.txt

      - name: 급락주 찾기
        working-directory: stock_screener
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python export_json.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "결과 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
