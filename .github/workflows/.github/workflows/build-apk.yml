name: 안드로이드 앱 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 서명키 준비
        run: |
          mkdir -p ~/.android
          cp mobile_app/debug.keystore ~/.android/debug.keystore

      - name: 안드로이드 프로젝트 구성
        working-directory: mobile_app
        run: |
          flutter create --org com.daehyuk --project-name drop_screener --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          sed -i 's#android:label="[^"]*"#android:label="급락주 스크리너"#' $M
          flutter pub get

      - name: APK 만들기
        working-directory: mobile_app
        run: >
          flutter build apk --release
          --dart-define=DATA_URL=https://raw.githubusercontent.com/${{ github.repository }}/main/data/results.json

      - name: 다운로드 페이지에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: 급락주 스크리너 앱
          body: 휴대폰에서 아래 app-release.apk 를 눌러 내려받은 뒤 설치하세요.
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
